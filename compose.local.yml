services:
  postgres:
    image: postgres:16-alpine
    container_name: korgi_postgres
    environment:
      POSTGRES_USER: korgi
      POSTGRES_PASSWORD: korgi_secret
      POSTGRES_DB: korgi_trade_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korgi -d korgi_trade_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: korgi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

